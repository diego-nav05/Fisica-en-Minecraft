plugins {
	id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	// Pruebas dentro del juego (Fabric GameTest). No se incluyen en el jar del mod.
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Código de cliente (renderizado) separado en src/client.
	splitEnvironmentSourceSets()

	mods {
		"tiroparabolico" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"tiroparabolico_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// Pruebas dentro del juego (servidor sin interfaz): ./gradlew runGametest
		gametest {
			server()
			source sourceSets.gametest
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/junit-gametest.xml"
			runDir "build/gametest"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JUnit tal como indica la documentación de Fabric (Automated Testing).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.0"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}
